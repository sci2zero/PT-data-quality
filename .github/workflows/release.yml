name: Release data quality repository

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Validate and generate
        run: |
          pt-data-quality validate source/rsr.xlsx
          pt-data-quality build source/rsr.xlsx --output generated

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          cp source/rsr.xlsx "dist/PT-data-quality-${GITHUB_REF_NAME}.xlsx"
          cp generated/rsr/rsr.json "dist/RSR-${GITHUB_REF_NAME}.json"
          cp generated/reports/validation.md "dist/validation-${GITHUB_REF_NAME}.md"
          (cd generated && zip -r "../dist/profiles-${GITHUB_REF_NAME}.zip" profiles)
          (cd generated && zip -r "../dist/implementation-${GITHUB_REF_NAME}.zip" implementation)
          (cd generated && zip -r "../dist/documentation-${GITHUB_REF_NAME}.zip" docs)
          (cd generated && zip -r "../dist/reports-${GITHUB_REF_NAME}.zip" reports)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
