name: Validate data quality repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[docs]"

      - name: Validate source
        run: pt-data-quality validate source/rsr.xlsx

      - name: Regenerate artefacts
        run: pt-data-quality build source/rsr.xlsx --output generated

      - name: Check generated files are committed
        run: git diff --exit-code -- generated

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build documentation
        run: mkdocs build --strict
